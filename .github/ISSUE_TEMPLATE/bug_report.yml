name: Bug report
description: Report a reproducible problem with Room Daylight
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce it.

  - type: input
    id: room_daylight_version
    attributes:
      label: Room Daylight version
      description: The installed release, for example v0.1.0.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.0
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure a room with ...
        2. Set ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Describe the room inputs, window orientations, entity types, and covering behaviour. Do not include secrets.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant Home Assistant log output here.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I have removed passwords, tokens, location details, and other sensitive information.
          required: true
